<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Chats</title>
    {% include 'css.html' %}
</head>
<style>
.outgoing_msg{
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    overflow:hidden;
    background: rgb(213, 232, 238) none repeat scroll 0 0;
    border-radius: 3px;
    font-size: 14px;
    margin: 0; color:rgb(0, 0, 0);
    padding: 5px 10px 5px 12px;
    width:100%;
    margin:26px 0 26px;
    }
.outgoing_msg p{
    text-align:right;
}
.incoming_msg {
  overflow:hidden;
  display: inline-block;
  width: 100%;
  background: #e0cccc none repeat scroll 0 0;
  border-radius: 3px;
  color: #000000;
  font-size: 14px;
  margin: 0;
  padding: 5px 10px 5px 12px;
  width: 100%;
}
.outgoing_msg h6{
    text-align:right;
    font-weight: bold;
}
.incoming_msg h6{
    font-weight: bold;
}
</style>
<body>

<div class='container'>
    <div class='row border-bottom my-3 py-3'>
        <div class='col'>
            <h1 class='p-0 m-0'>CareU</h1>
        </div>
    </div>
{% block content %}
{% endblock %}
</div>


{% include 'js.html' %}
{% block script %}
{% endblock %}

</body>
</html>
